name: Deploy to Firebase

on:
  push:
    branches:
      - main            # auto-deploy on every push to main
  pull_request:
    branches:
      - main            # deploy preview on PRs, comment with preview URL

jobs:
  # ── Deploy to Firebase Hosting (+ Functions on main pushes) ────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write   # needed to post preview-URL comments on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ── Push to main → deploy Cloud Functions ───────────────────────────
      - name: Deploy Cloud Functions (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDGEBOOK_2DCE2 }}' > /tmp/sa.json
          firebase deploy --only functions --project edgebook-2dce2 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      # ── Push to main → deploy Hosting ───────────────────────────────────
      - name: Deploy Hosting (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDGEBOOK_2DCE2 }}
          projectId: edgebook-2dce2
          channelId: live
          entryPoint: "."

      # ── Pull request → hosting preview only (functions unchanged) ────────
      - name: Deploy Firebase Hosting preview (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDGEBOOK_2DCE2 }}
          projectId: edgebook-2dce2
          entryPoint: "."
