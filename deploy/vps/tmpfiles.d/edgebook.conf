# Template for systemd-tmpfiles. Numeric 12001 matches the non-root API user in
# Dockerfile.api. Review paths and ownership before installing this file.
d /srv/edgebook-data 0750 12001 12001 -
d /srv/edgebook-data/uploads 0750 12001 12001 -
d /srv/edgebook-data/restore 0700 root root -
d /srv/edgebook-migration 0700 12001 12001 -
d /srv/edgebook-migration/input 0700 12001 12001 -
d /srv/edgebook-migration/output 0700 12001 12001 -
d /var/backups/edgebook 0700 root root -
d /run/edgebook 0750 root root -
