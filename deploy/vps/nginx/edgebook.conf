# Template only. The certificate must cover both edgebook.trade and
# www.edgebook.trade. Run `nginx -t` before reload and do not replace unrelated
# server blocks.

map $uri $edgebook_cache_control {
    default "";
    / "no-store, max-age=0";
    ~^/(?:index|landing|app|404)\.html$ "no-store, max-age=0";
    ~^/client/ "no-store, max-age=0";
    /edgebook-build.json "no-store, max-age=0";
    /api/events "private, no-store, no-transform";
    ~^/api/ "private, no-store";
}

upstream edgebook_api {
    server 127.0.0.1:3210;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name edgebook.trade www.edgebook.trade;
    location = /api/auth/ctrader/callback {
        access_log off;
        return 404;
    }
    location / { return 301 https://edgebook.trade$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.edgebook.trade;

    ssl_certificate     /etc/letsencrypt/live/edgebook.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgebook.trade/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/auth/ctrader/callback {
        access_log off;
        return 404;
    }
    location / { return 301 https://edgebook.trade$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edgebook.trade;

    ssl_certificate     /etc/letsencrypt/live/edgebook.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgebook.trade/privkey.pem;

    root /opt/edgebook/current/public;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Daily Journal dictation may request the microphone only from this
    # first-party document. Browser permission is still required per user.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header X-XSS-Protection "0" always;
    # The legacy single-file UI still needs inline scripts/styles/handlers.
    # External execution/network access is nevertheless restricted to the
    # reviewed production dependencies. Legacy remote data/broker backends are
    # intentionally absent from the cutover policy.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdnjs.cloudflare.com https://accounts.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://ctrader.com https://googleusercontent.com https://*.googleusercontent.com https://ggpht.com https://*.ggpht.com https://*.gstatic.com; connect-src 'self' https://api.frankfurter.app https://accounts.google.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.xethub.hf.co; frame-src https://accounts.google.com; worker-src 'self' blob: https://cdn.jsdelivr.net; manifest-src 'self'; media-src 'self'; upgrade-insecure-requests" always;
    add_header Cache-Control $edgebook_cache_control always;

    # Private uploads are never mapped to the filesystem. The authenticated API
    # authorizes ownership and streams the object.
    location ^~ /uploads/ {
        return 404;
    }

    # Health/readiness remain host-local. Operators query 127.0.0.1:3210.
    location = /healthz { return 404; }
    location = /readyz  { return 404; }

    # OAuth authorization codes/state must never enter the normal access log.
    # This callback is served only on the canonical HTTPS origin; the HTTP and
    # www server blocks reject it instead of redirecting a query string.
    location = /api/auth/ctrader/callback {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host edgebook.trade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://edgebook_api;
    }

    location = /api/events {
        proxy_http_version 1.1;
        proxy_set_header Host edgebook.trade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 1h;
        proxy_pass http://edgebook_api;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host edgebook.trade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://edgebook_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
