<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Edgebook</title>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--panel:#111522;--line:#262d40;--text:#f4f6fb;--muted:#929bb0;--accent:#7c6cf2;--accent2:#4c9cf6}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 20% 15%,rgba(124,108,242,.16),transparent 34%),
      radial-gradient(circle at 85% 80%,rgba(76,156,246,.12),transparent 32%),var(--bg);
      color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,540px);padding:44px;border:1px solid var(--line);border-radius:22px;background:rgba(17,21,34,.92);box-shadow:0 24px 80px rgba(0,0,0,.38);text-align:center}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px;font-weight:700;letter-spacing:-.02em}
    .mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(124,108,242,.3)}
    .code{margin:0;color:#a99cff;font-size:clamp(64px,15vw,104px);font-weight:800;line-height:.95;letter-spacing:-.07em}
    h1{margin:20px 0 10px;font-size:28px;letter-spacing:-.035em}
    p{max-width:400px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.65}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border:1px solid var(--line);border-radius:11px;color:var(--text);font-size:14px;font-weight:650;text-decoration:none;transition:transform .15s,border-color .15s,background .15s}
    a:hover{transform:translateY(-1px);border-color:#4a5570;background:#171c2b}
    a.primary{border-color:transparent;background:linear-gradient(135deg,var(--accent),#6758dc)}
    a.primary:hover{background:linear-gradient(135deg,#897af7,#7161e6)}
    @media(max-width:520px){main{padding:34px 22px;border-radius:18px}.actions{flex-direction:column}a{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">E</span><span>Edgebook</span></div>
    <p class="code">404</p>
    <h1>This page slipped off the chart.</h1>
    <p>The address may be outdated or mistyped. Your journal and account data have not been changed.</p>
    <div class="actions">
      <a class="primary" href="/app.html">Open dashboard</a>
      <a href="/">Return home</a>
    </div>
  </main>
</body>
</html>
